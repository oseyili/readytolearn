services:
  - type: web
    name: readytolearn-web
    runtime: static
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm -C apps/web build
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: readytolearn-api
    runtime: node
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
    startCommand: pnpm -C apps/api start
    envVars:
      - key: NODE_VERSION
        value: "20"
