services:
  # ======================
  # WEB (Next.js Static)
  # ======================
  - type: web
    name: readytolearn-web
    runtime: static
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm -C apps/web build
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: "20"

  # ======================
  # API (Node backend)
  # ======================
  - type: web
    name: readytolearn-api
    runtime: node
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm -C apps/api build
    startCommand: pnpm -C apps/api start
    envVars:
      - key: NODE_VERSION
        value: "20"
