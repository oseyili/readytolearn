name: Generate Courses Catalog

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate courses
        run: node apps/web/scripts/generate-courses.mjs

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/web/app/courses/courses.data.ts
          git commit -m "chore(web): generate full courses catalog" || echo "Nothing to commit"
          git push
